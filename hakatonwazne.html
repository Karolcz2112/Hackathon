<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Drive 3D</title>
  <style>
    :root {
      --bg: #07151f;
      --panel: rgba(11, 18, 26, 0.8);
      --line: rgba(255,255,255,0.08);
      --cyan: #63e8ff;
      --text: #edf8ff;
      --muted: #9eb7c8;
      --gold: #ffd166;
      --red: #ff5f6d;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top, rgba(99,232,255,0.2), transparent 30%), linear-gradient(180deg, #07151f 0%, #0b1722 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
    }

    .topbar {
      width: min(1200px, calc(100vw - 2rem));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: rgba(11,18,26,0.74);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 0.9rem 1rem;
      box-shadow: 0 18px 38px rgba(0,0,0,0.28);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.15rem, 1.4vw + 0.9rem, 2rem);
    }

    .brand span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }

    .stat {
      min-width: 110px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
    }

    .stat .label {
      display: block;
      font-size: 0.66rem;
      color: var(--muted);
      letter-spacing: 0.08rem;
      text-transform: uppercase;
    }

    .stat .value {
      display: block;
      font-weight: 900;
      margin-top: 0.2rem;
      font-size: 1.1rem;
    }

    .game-wrap {
      width: min(1200px, calc(100vw - 2rem));
      height: min(780px, calc(100vh - 150px));
      position: relative;
      background: linear-gradient(180deg, rgba(8,18,26,0.95), rgba(10,20,30,0.99));
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 38px rgba(0,0,0,0.32);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #0a1d2e 0%, #0d2941 45%, #102b3d 100%);
    }

    .message {
      position: absolute;
      left: 1rem;
      bottom: 1rem;
      background: rgba(7,18,26,0.7);
      border: 1px solid rgba(99,232,255,0.35);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      backdrop-filter: blur(6px);
      max-width: 320px;
      z-index: 10;
      pointer-events: none;
    }

    .message strong {
      display: block;
      color: var(--cyan);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08rem;
      margin-bottom: 0.2rem;
    }

    .message span {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .button {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      z-index: 10;
      background: linear-gradient(180deg, rgba(99,232,255,0.16), rgba(26,163,198,0.1));
      border: 1px solid rgba(99,232,255,0.34);
      color: var(--text);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      cursor: pointer;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .hud {
        width: 100%;
        justify-content: space-between;
      }
      .stat { flex: 1 1 27%; min-width: 0; }
      .game-wrap { height: min(650px, calc(100vh - 210px)); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>City Drive 3D</h1>
      <span>3D arcade driving — wyprzedzaj, zbieraj pieniądze i unikaj kolizji</span>
    </div>

    <div class="hud">
      <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
      <div class="stat"><span class="label">Cash</span><span class="value" id="cash">0</span></div>
      <div class="stat"><span class="label">Time</span><span class="value" id="time">90</span></div>
      <div class="stat"><span class="label">Fuel</span><span class="value" id="fuel">100%</span></div>
      <div class="stat"><span class="label">Speed</span><span class="value" id="speed">0</span></div>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="gameCanvas"></canvas>
    <div class="message">
      <strong>Mission</strong>
      <span id="missionText">Jedź, zbieraj pieniądze i nie rozbij się.</span>
    </div>
    <button class="button" id="restartBtn">Restart</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const cashEl = document.getElementById('cash');
    const timeEl = document.getElementById('time');
    const fuelEl = document.getElementById('fuel');
    const speedEl = document.getElementById('speed');
    const missionTextEl = document.getElementById('missionText');
    const restartBtn = document.getElementById('restartBtn');

    let w = 0;
    let h = 0;
    let road = { width: 420, half: 210, centerY: 0 };
    let game = null;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      w = Math.max(300, rect.width);
      h = Math.max(300, rect.height);
      canvas.width = Math.floor(w * ratio);
      canvas.height = Math.floor(h * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener('resize', resize);
    resize();

    const keys = {
      left: false,
      right: false,
      up: false,
      down: false
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') keys.up = true;
      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') keys.down = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') keys.up = false;
      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') keys.down = false;
    });

    function resetGame() {
      game = {
        running: true,
        score: 0,
        cash: 0,
        timeLeft: 90,
        fuel: 100,
        speed: 0,
        maxSpeed: 260,
        roadOffset: 0,
        playerLane: 0,
        playerX: 0,
        obstacles: [],
        coins: [],
        lastSpawn: 0,
        lastCoin: 0,
        lastTime: 0,
        shake: 0,
        mission: 'Jedź, zbieraj pieniądze i nie rozbij się.'
      };
    }

    resetGame();

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3) - 1;
      const z = 1.2;
      const color = ['#ff7b72', '#fbbf24', '#60a5fa', '#a78bfa', '#34d399'][Math.floor(Math.random() * 5)];
      game.obstacles.push({ lane, z, color, width: 40, height: 60 });
    }

    function spawnCoin() {
      const lane = Math.floor(Math.random() * 3) - 1;
      game.coins.push({ lane, z: 1.2, r: 14, value: 25 });
    }

    function updateGame(dt) {
      if (!game.running) return;

      const accel = keys.up ? 140 : 0;
      const brake = keys.down ? 220 : 0;
      const steer = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);

      if (keys.up) game.speed += accel * dt;
      if (keys.down) game.speed -= brake * dt;
      if (!keys.up && !keys.down) game.speed *= 0.985;

      game.speed = Math.max(0, Math.min(game.maxSpeed, game.speed));
      game.playerLane += steer * dt * 2.5;
      game.playerLane = Math.max(-1.2, Math.min(1.2, game.playerLane));
      game.playerX = game.playerLane * 170;

      game.roadOffset += game.speed * dt * 0.9;
      game.timeLeft -= dt;
      game.fuel = Math.max(0, game.fuel - dt * (game.speed / 70) + (keys.down ? 0.1 : 0));

      if (game.timeLeft <= 0 || game.fuel <= 0) {
        game.running = false;
        game.mission = 'Koniec gry — kliknij Restart.';
      }

      if (Math.random() < 0.018 + dt * 0.5) spawnObstacle();
      if (Math.random() < 0.012 + dt * 0.3) spawnCoin();

      for (let i = game.obstacles.length - 1; i >= 0; i--) {
        const o = game.obstacles[i];
        o.z += (0.6 + game.speed / 180) * dt;
        if (o.z > 1.8) {
          game.obstacles.splice(i, 1);
          game.score += 10;
        }

        if (o.z > 1.1 && o.z < 1.4) {
          const close = Math.abs(o.lane - game.playerLane) < 0.55;
          if (close) {
            game.running = false;
            game.mission = 'Kolizja! Wystarczy restart.';
            game.shake = 0.6;
          }
        }
      }

      for (let i = game.coins.length - 1; i >= 0; i--) {
        const coin = game.coins[i];
        coin.z += (0.7 + game.speed / 200) * dt;
        if (coin.z > 1.8) {
          game.coins.splice(i, 1);
          continue;
        }

        if (coin.z > 1.08 && coin.z < 1.42 && Math.abs(coin.lane - game.playerLane) < 0.45) {
          game.cash += coin.value;
          game.score += 60;
          game.coins.splice(i, 1);
          game.mission = 'Dobrze! Złapana nagroda.';
        }
      }

      if (game.score > 0 && game.score % 900 < 20 && game.cash > 0 && game.running) {
        game.maxSpeed = Math.min(340, game.maxSpeed + 0.02);
      }

      game.shake = Math.max(0, game.shake - dt * 1.4);
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(game.score);
      cashEl.textContent = Math.floor(game.cash);
      timeEl.textContent = Math.max(0, Math.ceil(game.timeLeft));
      fuelEl.textContent = `${Math.ceil(game.fuel)}%`;
      speedEl.textContent = `${Math.floor(game.speed)} km/h`;
      missionTextEl.textContent = game.mission;
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.7);
      sky.addColorStop(0, '#0b1b2c');
      sky.addColorStop(0.5, '#18314d');
      sky.addColorStop(1, '#1a3550');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      const sunX = w * 0.82;
      const sunY = h * 0.18;
      const sun = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 80);
      sun.addColorStop(0, 'rgba(255, 219, 110, 0.95)');
      sun.addColorStop(1, 'rgba(255, 219, 110, 0)');
      ctx.fillStyle = sun;
      ctx.fillRect(sunX - 120, sunY - 120, 240, 240);

      for (let i = 0; i < 30; i++) {
        const x = ((i * 170) % (w + 120)) - 60;
        const y = 80 + ((i * 90) % 220);
        const hgt = 30 + ((i * 31) % 80);
        ctx.fillStyle = 'rgba(16, 24, 31, 0.9)';
        ctx.fillRect(x, y, 42, hgt);
        ctx.fillStyle = 'rgba(99,232,255,0.08)';
        ctx.fillRect(x + 8, y + 8, 12, hgt - 16);
      }
    }

    function drawRoad() {
      const horizon = h * 0.26;
      const roadTopWidth = w * 0.18;
      const roadBottomWidth = w * 0.85;
      const roadY = h * 0.18;

      ctx.fillStyle = '#1a202a';
      ctx.beginPath();
      ctx.moveTo(w / 2 - roadTopWidth / 2, roadY);
      ctx.lineTo(w / 2 + roadTopWidth / 2, roadY);
      ctx.lineTo(w / 2 + roadBottomWidth / 2, h);
      ctx.lineTo(w / 2 - roadBottomWidth / 2, h);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w / 2 - roadTopWidth / 2, roadY);
      ctx.lineTo(w / 2 - roadBottomWidth / 2, h);
      ctx.moveTo(w / 2 + roadTopWidth / 2, roadY);
      ctx.lineTo(w / 2 + roadBottomWidth / 2, h);
      ctx.stroke();

      for (let i = 0; i < 14; i++) {
        const t = i / 14;
        const y = roadY + (h - roadY) * t;
        const x1 = w / 2 - (roadTopWidth / 2 + (roadBottomWidth - roadTopWidth) * t) * 0.5;
        const x2 = w / 2 + (roadTopWidth / 2 + (roadBottomWidth - roadTopWidth) * t) * 0.5;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x1 + (x2 - x1) * 0.25, y);
        ctx.lineTo(x1 + (x2 - x1) * 0.25, y + 20);
        ctx.moveTo(x2 - (x2 - x1) * 0.25, y);
        ctx.lineTo(x2 - (x2 - x1) * 0.25, y + 20);
        ctx.stroke();
      }
    }

    function drawObstacles() {
      for (const o of game.obstacles) {
        const z = Math.min(1.8, o.z);
        const scale = 1 / (0.3 + z * 1.4);
        const x = w / 2 + o.lane * 170 * scale;
        const y = 120 + (z - 0.2) * 260 + (1 / z) * 120;
        const wv = 32 * scale;
        const hv = 58 * scale;

        ctx.fillStyle = o.color;
        ctx.fillRect(x - wv / 2, y - hv / 2, wv, hv);
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.fillRect(x - (wv * 0.6) / 2, y - hv * 0.15, wv * 0.6, hv * 0.5);
      }
    }

    function drawCoins() {
      for (const c of game.coins) {
        const z = Math.min(1.8, c.z);
        const scale = 1 / (0.4 + z * 1.5);
        const x = w / 2 + c.lane * 170 * scale;
        const y = 100 + (z - 0.2) * 260 + (1 / z) * 110;
        const r = c.r * scale;

        ctx.beginPath();
        ctx.fillStyle = '#ffd166';
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = '#fff3bf';
        ctx.lineWidth = 2;
        ctx.arc(x, y, r * 0.6, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const x = w / 2 + game.playerX;
      const y = h - 120;
      const bodyW = 60;
      const bodyH = 90;

      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#63e8ff';
      ctx.fillRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH);
      ctx.fillStyle = '#eafcff';
      ctx.fillRect(-20, -28, 16, 18);
      ctx.fillRect(4, -28, 16, 18);
      ctx.fillStyle = '#0b1622';
      ctx.fillRect(-18, -8, 12, 12);
      ctx.fillRect(6, -8, 12, 12);
      ctx.fillRect(-18, 22, 12, 12);
      ctx.fillRect(6, 22, 12, 12);
      ctx.restore();
    }

    function draw() {
      const shakeX = game.shake > 0 ? (Math.random() - 0.5) * 10 * game.shake : 0;
      const shakeY = game.shake > 0 ? (Math.random() - 0.5) * 10 * game.shake : 0;

      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(shakeX, shakeY);

      drawBackground();
      drawRoad();
      drawCoins();
      drawObstacles();
      drawPlayer();

      ctx.restore();
    }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min((now - last) / 1000, 0.033);
      last = now;
      updateGame(dt);
      draw();
      requestAnimationFrame(tick);
    }

    restartBtn.addEventListener('click', () => {
      resetGame();
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
