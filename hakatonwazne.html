<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Bus Rush 2D</title>
  <style>
    :root {
      --bg: #06131d;
      --panel: rgba(10, 19, 30, 0.82);
      --cyan: #5ee7ff;
      --text: #edf6ff;
      --muted: #9db4c4;
      --shadow: 0 18px 38px rgba(0,0,0,0.38);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, 0.18), transparent 38%),
        linear-gradient(180deg, #06131d 0%, #111827 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
    }

    .topbar {
      width: min(1280px, calc(100vw - 2rem));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: rgba(11,18,26,0.7);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 0.9rem 1.1rem;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.1rem, 1.3vw + 0.9rem, 2rem);
      letter-spacing: 0.6px;
    }

    .brand span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 112px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
    }

    .stat .label {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06rem;
      text-transform: uppercase;
    }

    .stat .value {
      display: block;
      font-weight: 900;
      font-size: 1.1rem;
      margin-top: 0.2rem;
    }

    .game-shell {
      width: min(1280px, calc(100vw - 2rem));
      height: min(720px, calc(100vh - 140px));
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(10,17,24,0.96), rgba(12,20,30,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
    }

    #game-root {
      width: 100%;
      height: 100%;
    }

    .mission-box {
      position: absolute;
      left: 1rem;
      bottom: 1rem;
      background: rgba(6, 17, 26, 0.72);
      border: 1px solid rgba(94,231,255,0.28);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      max-width: 340px;
      backdrop-filter: blur(8px);
      z-index: 10;
      pointer-events: none;
    }

    .mission-box strong {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--cyan);
      letter-spacing: 0.08rem;
      margin-bottom: 0.25rem;
    }

    .mission-box span {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .control-button {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      z-index: 11;
      background: linear-gradient(180deg, rgba(94,231,255,0.14), rgba(34,211,238,0.1));
      border: 1px solid rgba(94,231,255,0.38);
      color: var(--text);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 12px 20px rgba(0,0,0,0.2);
    }

    @media (max-width: 760px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .hud {
        width: 100%;
        justify-content: space-between;
      }
      .stat {
        flex: 1 1 28%;
        min-width: auto;
      }
      .game-shell {
        height: min(640px, calc(100vh - 220px));
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>City Bus Rush 2D</h1>
      <span>Autobus przez miasto — misje, pasażerowie, czas i paliwo</span>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="label">Time</span>
        <span class="value" id="time">180</span>
      </div>
      <div class="stat">
        <span class="label">Pasażerowie</span>
        <span class="value" id="passengers">0</span>
      </div>
      <div class="stat">
        <span class="label">Paliwo</span>
        <span class="value" id="fuel">100%</span>
      </div>
    </div>
  </div>

  <div class="game-shell">
    <div id="game-root"></div>
    <div class="mission-box">
      <strong>Misja</strong>
      <span id="missionText">Zbieraj pasażerów i dowoź ich do punktów docelowych.</span>
    </div>
    <button class="control-button" id="restartBtn">Restart</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const passengerEl = document.getElementById('passengers');
    const fuelEl = document.getElementById('fuel');
    const missionTextEl = document.getElementById('missionText');
    const restartBtn = document.getElementById('restartBtn');

    class CityBusScene extends Phaser.Scene {
      constructor() {
        super('CityBusScene');
      }

      create() {
        this.worldWidth = 2200;
        this.worldHeight = 1600;
        this.gameOver = false;
        this.score = 0;
        this.timeLeft = 180;
        this.currentMission = null;
        this.activePassenger = null;
        this.passengerCount = 0;
        this.fuel = 100;
        this.stopWaiters = new Set();

        this.cameras.main.setBackgroundColor('#102330');
        this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);

        this.createCity();
        this.createPlayer();
        this.createStops();
        this.createTraffic();
        this.createRoadDecor();
        this.createInput();
        this.updateHud();

        this.time.addEvent({
          delay: 1000,
          loop: true,
          callback: () => {
            if (this.gameOver) return;
            this.timeLeft -= 1;
            const driftFactor = Math.abs(this.player.speed) / 240;
            this.fuel = Phaser.Math.Clamp(this.fuel - 1.2 * driftFactor, 0, 100);
            if (this.timeLeft <= 0 || this.fuel <= 0) {
              this.endGame();
            }
            this.updateHud();
          }
        });
      }

      createCity() {
        this.roadRects = [];
        const g = this.add.graphics();
        g.fillStyle(0x143245, 1);
        g.fillRect(0, 0, this.worldWidth, this.worldHeight);

        const roadData = [
          { x: 200, y: 130, w: 1680, h: 130 },
          { x: 200, y: 430, w: 1680, h: 130 },
          { x: 200, y: 780, w: 1680, h: 130 },
          { x: 200, y: 1130, w: 1680, h: 130 },
          { x: 300, y: 80, w: 120, h: 1420 },
          { x: 650, y: 80, w: 120, h: 1420 },
          { x: 1000, y: 80, w: 120, h: 1420 },
          { x: 1350, y: 80, w: 120, h: 1420 },
          { x: 1700, y: 80, w: 120, h: 1420 },
          { x: 1940, y: 80, w: 120, h: 1420 }
        ];

        roadData.forEach((r) => {
          g.fillStyle(0x2a3542, 1);
          g.fillRoundedRect(r.x, r.y, r.w, r.h, 20);
          this.roadRects.push(new Phaser.Geom.Rectangle(r.x, r.y, r.w, r.h));

          g.lineStyle(3, 0xf5f5f5, 0.18);
          if (r.w > r.h) {
            for (let i = r.x + 50; i < r.x + r.w; i += 110) {
              g.fillStyle(0xf6f8fb, 0.25);
              g.fillRect(i, r.y + r.h / 2 - 4, 30, 8);
            }
          } else {
            for (let i = r.y + 50; i < r.y + r.h; i += 110) {
              g.fillStyle(0xf6f8fb, 0.25);
              g.fillRect(r.x + r.w / 2 - 4, i, 8, 30);
            }
          }
        });

        const blocks = [
          { x: 0, y: 0, w: 2200, h: 130 },
          { x: 0, y: 260, w: 200, h: 170 },
          { x: 0, y: 560, w: 200, h: 220 },
          { x: 0, y: 910, w: 200, h: 220 },
          { x: 0, y: 1260, w: 200, h: 340 },
          { x: 1880, y: 260, w: 320, h: 170 },
          { x: 1880, y: 560, w: 320, h: 220 },
          { x: 1880, y: 910, w: 320, h: 220 },
          { x: 1880, y: 1260, w: 320, h: 340 }
        ];

        blocks.forEach((b) => {
          const shade = Phaser.Display.Color.GetColor(
            32 + Math.random() * 20,
            52 + Math.random() * 25,
            60 + Math.random() * 25
          );
          g.fillStyle(shade, 1);
          g.fillRoundedRect(b.x, b.y, b.w, b.h, 10);
          g.fillStyle(0x0a0f16, 0.35);
          g.fillRect(b.x + 18, b.y + 18, b.w - 36, b.h - 36);
        });

        for (let i = 0; i < 70; i++) {
          const x = 120 + Math.random() * (this.worldWidth - 240);
          const y = 120 + Math.random() * (this.worldHeight - 240);
          g.fillStyle(Phaser.Display.Color.GetColor(25, 120, 60), 1);
          g.fillCircle(x, y, 6);
        }
      }

      createPlayer() {
        const g = this.make.graphics({ add: false });
        g.fillStyle(0x2bd7ff, 1);
        g.fillRoundedRect(0, 0, 120, 60, 16);
        g.fillStyle(0xeafcff, 0.9);
        for (let i = 0; i < 4; i++) {
          g.fillRoundedRect(16 + i * 26, 10, 16, 16, 4);
        }
        g.fillStyle(0x0d1320, 1);
        g.fillRoundedRect(10, 18, 12, 12, 3);
        g.fillRoundedRect(98, 18, 12, 12, 3);
        g.fillRoundedRect(10, 30, 12, 12, 3);
        g.fillRoundedRect(98, 30, 12, 12, 3);
        g.generateTexture('busBody', 120, 60);
        g.destroy();

        this.player = this.physics.add.sprite(280, 250, 'busBody');
        this.player.setCollideWorldBounds(true);
        this.player.setDepth(30);
        this.player.setDrag(200);
        this.player.setBounce(0.05);
        this.player.body.setSize(110, 40);
        this.player.angle = 90;
        this.player.speed = 0;
        this.player.fuel = 100;

        this.cameras.main.startFollow(this.player, true, 0.09, 0.09);
      }

      createStops() {
        this.stops = [
          { id: 'stationA', name: 'Dworzec', x: 280, y: 220, waiting: true },
          { id: 'stationB', name: 'Rondo', x: 990, y: 240, waiting: true },
          { id: 'stationC', name: 'Park', x: 680, y: 890, waiting: true },
          { id: 'stationD', name: 'Centrum', x: 1550, y: 1020, waiting: true },
          { id: 'stationE', name: 'Port', x: 1980, y: 470, waiting: true },
          { id: 'stationF', name: 'Muzeum', x: 1480, y: 1310, waiting: true }
        ];

        this.stopSprites = [];
        this.stops.forEach((s) => {
          const ring = this.add.circle(s.x, s.y, 22, 0x5ee7ff, 0.2);
          const dot = this.add.circle(s.x, s.y, 11, 0x5ee7ff, 1);
          const label = this.add.text(s.x, s.y + 36, s.name, {
            font: 'bold 12px Inter, Segoe UI, sans-serif',
            color: '#dff7ff',
            backgroundColor: 'rgba(3, 9, 15, 0.5)',
            padding: { x: 6, y: 2 }
          }).setOrigin(0.5);
          this.stopSprites.push({ ring, dot, label, ...s });
        });
      }

      createRoadDecor() {
        const treeG = this.make.graphics({ add: false });
        treeG.fillStyle(0x12a66d, 1);
        treeG.fillCircle(0, 0, 20);
        treeG.generateTexture('tree', 40, 40);
        treeG.destroy();

        for (let i = 0; i < 30; i++) {
          const x = 240 + Math.random() * (this.worldWidth - 480);
          const y = 200 + Math.random() * (this.worldHeight - 400);
          if (this.roadRects.some(r => Phaser.Geom.Rectangle.Contains(r, x, y))) {
            continue;
          }
          this.add.image(x, y, 'tree').setScale(0.8 + Math.random() * 0.5).setDepth(5);
        }
      }

      createTraffic() {
        this.trafficCars = [];
        const laneConfigs = [
          { x: 470, y: 205, dir: 1, color: 0xffb703 },
          { x: 990, y: 205, dir: 1, color: 0xff7d50 },
          { x: 1460, y: 205, dir: 1, color: 0x7dd3fc },
          { x: 1800, y: 520, dir: -1, color: 0x8b5cf6 },
          { x: 1080, y: 890, dir: 1, color: 0x34d399 },
          { x: 1580, y: 890, dir: 1, color: 0x38bdf8 },
          { x: 1030, y: 1250, dir: -1, color: 0xf97316 },
          { x: 700, y: 1250, dir: -1, color: 0xfbbf24 }
        ];

        const graphics = this.make.graphics({ add: false });
        graphics.fillStyle(0x111827, 1);
        graphics.fillRoundedRect(0, 0, 48, 26, 8);
        graphics.fillStyle(0xffffff, 1);
        graphics.fillRoundedRect(14, 6, 18, 8, 2);
        graphics.generateTexture('trafficCar', 48, 26);
        graphics.destroy();

        laneConfigs.forEach((cfg, i) => {
          const car = this.physics.add.sprite(cfg.x, cfg.y, 'trafficCar');
          car.setTint(cfg.color);
          car.setDepth(12);
          car.setImmovable(true);
          car.body.setAllowGravity(false);
          car.direction = cfg.dir;
          car.speed = 55 + i * 12;
          car.setSize(44, 20);
          this.trafficCars.push(car);
        });
      }

      createInput() {
        this.cursorKeys = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
          W: Phaser.Input.Keyboard.KeyCodes.W,
          A: Phaser.Input.Keyboard.KeyCodes.A,
          S: Phaser.Input.Keyboard.KeyCodes.S,
          D: Phaser.Input.Keyboard.KeyCodes.D,
          E: Phaser.Input.Keyboard.KeyCodes.E,
          SHIFT: Phaser.Input.Keyboard.KeyCodes.SHIFT
        });
      }

      updateHud() {
        scoreEl.textContent = this.score;
        timeEl.textContent = String(Math.max(0, this.timeLeft));
        passengerEl.textContent = String(this.passengerCount);
        fuelEl.textContent = `${Math.round(this.fuel)}%`;
        missionTextEl.textContent = this.currentMission || 'Zbieraj pasażerów i dowoź ich do punktów docelowych.';
      }

      getNearestStop() {
        let best = null;
        let bestDist = Infinity;
        this.stops.forEach((stop) => {
          const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, stop.x, stop.y);
          if (d < bestDist && d < 85) {
            bestDist = d;
            best = stop;
          }
        });
        return best;
      }

      attemptPickupOrDrop() {
        const stop = this.getNearestStop();
        if (!stop) return;

        if (this.activePassenger && stop.id === this.activePassenger.to) {
          this.score += 120 + this.activePassenger.multiplier * 25;
          this.passengerCount = Math.max(0, this.passengerCount - 1);
          this.activePassenger = null;
          this.currentMission = 'Misja zakończona! Jedź dalej.';
          this.updateHud();
          return;
        }

        if (!this.activePassenger && stop.waiting) {
          const validStops = this.stops.filter(s => s.id !== stop.id);
          const target = Phaser.Utils.Array.GetRandom(validStops);
          this.activePassenger = {
            from: stop.id,
            to: target.id,
            multiplier: 1 + Math.floor(Math.random() * 4),
            destinationName: target.name
          };
          stop.waiting = false;
          this.passengerCount += 1;
          this.currentMission = `Pasażer: ${stop.name} → ${target.name}`;
          this.updateHud();
          return;
        }
      }

      endGame() {
        this.gameOver = true;
        this.currentMission = 'Koniec gry — kliknij Restart i zacznij od nowa.';
        this.updateHud();
        this.cameras.main.shake(220, 0.016);
      }

      update(time, delta) {
        if (this.gameOver) return;

        const dt = delta / 1000;
        const left = this.cursorKeys.left.isDown || this.keys.A.isDown;
        const right = this.cursorKeys.right.isDown || this.keys.D.isDown;
        const accelerate = this.cursorKeys.up.isDown || this.keys.W.isDown;
        const brake = this.cursorKeys.down.isDown || this.keys.S.isDown;
        const boost = this.keys.SHIFT.isDown;
        const pickupButton = Phaser.Input.Keyboard.JustDown(this.keys.E);

        if (pickupButton) {
          this.attemptPickupOrDrop();
        }

        const maxSpeed = boost ? 380 : 255;
        if (accelerate) this.player.speed += 190 * dt;
        if (brake) this.player.speed -= 260 * dt;
        if (!accelerate && !brake) this.player.speed *= 0.985;

        const turnPower = Phaser.Math.Clamp(Math.abs(this.player.speed) / maxSpeed, 0.2, 1);
        if (left) this.player.rotation -= 1.5 * dt * turnPower;
        if (right) this.player.rotation += 1.5 * dt * turnPower;

        this.player.speed = Phaser.Math.Clamp(this.player.speed, -75, maxSpeed);

        const isOnRoad = this.roadRects.some((r) => Phaser.Geom.Rectangle.Contains(r, this.player.x, this.player.y));
        if (!isOnRoad) {
          this.player.speed *= 0.96;
          if (this.player.speed < 0.5) this.player.speed = 0;
        }

        this.player.x += Math.cos(this.player.rotation) * this.player.speed * dt;
        this.player.y += Math.sin(this.player.rotation) * this.player.speed * dt;

        this.player.x = Phaser.Math.Clamp(this.player.x, 70, this.worldWidth - 70);
        this.player.y = Phaser.Math.Clamp(this.player.y, 70, this.worldHeight - 70);

        this.stopSprites.forEach((stop) => {
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, stop.x, stop.y);
          if (dist < 36) {
            stop.ring.setFillStyle(0x5ee7ff, 0.45);
            stop.dot.setScale(1.12);
          } else {
            stop.ring.setFillStyle(0x5ee7ff, 0.2);
            stop.dot.setScale(1);
          }
        });

        this.trafficCars.forEach((car) => {
          car.x += car.direction * car.speed * dt;
          if (car.x < 110 || car.x > this.worldWidth - 110) {
            car.direction *= -1;
          }
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, car.x, car.y);
          if (dist < 48) {
            this.player.speed *= 0.62;
            this.fuel = Phaser.Math.Clamp(this.fuel - 8, 0, 100);
            this.score = Math.max(0, this.score - 15);
            this.cameras.main.shake(80, 0.012);
          }
        });

        if (Math.abs(this.player.speed) > 90) {
          this.fuel = Phaser.Math.Clamp(this.fuel - dt * 6, 0, 100);
        }

        if (this.fuel <= 0) {
          this.endGame();
        }

        this.updateHud();
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: 1280,
      height: 720,
      parent: 'game-root',
      backgroundColor: '#06131d',
      scene: [CityBusScene],
      physics: {
        default: 'arcade',
        arcade: { debug: false, gravity: { y: 0 } }
      },
      render: { antialias: true, pixelArt: false }
    };

    const game = new Phaser.Game(config);
    restartBtn.addEventListener('click', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
