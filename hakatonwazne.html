<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hackathon event landing page with mini game">
    <title>Hackathon Challenge</title>
    <style>
        :root {
            --bg: #f3f7ff;
            --panel: #ffffff;
            --dark: #0f172a;
            --primary: #2563eb;
            --accent: #22c55e;
            --text: #1f2937;
            --muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 100%);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: var(--dark);
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        main {
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        section {
            background: var(--panel);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            padding: 1.5rem;
        }

        .subtitle {
            margin-top: 0.5rem;
            color: var(--muted);
            text-align: center;
        }

        .game-box {
            margin-top: 1.5rem;
            border: 1px solid #dfe7f5;
            border-radius: 14px;
            padding: 1rem;
            background: #f9fbff;
        }

        .game-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .scoreboard {
            font-weight: 700;
            color: var(--dark);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .game-area {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 220px;
            margin: 0 auto;
            border-radius: 12px;
            background: linear-gradient(180deg, #e2e8f0, #f8fafc);
            border: 2px solid #cbd5e1;
            overflow: hidden;
        }

        .target {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
            cursor: pointer;
            display: none;
        }

        .target::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 3px solid rgba(255,255,255,0.8);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hackathon</h1>
    </header>

    <main>
        <section>
            <p class="subtitle">Welcome to the Hackathon challenge</p>

            <div class="game-box">
                <div class="game-top">
                    <div class="scoreboard">Score: <span id="score">0</span></div>
                    <div class="scoreboard">Time: <span id="time">15</span>s</div>
                    <button id="startBtn">Start game</button>
                </div>

                <div class="game-area" id="gameArea" aria-label="Mini game area">
                    <div class="target" id="target" aria-label="Target"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const scoreEl = document.getElementById("score");
        const timeEl = document.getElementById("time");
        const startBtn = document.getElementById("startBtn");
        const gameArea = document.getElementById("gameArea");
        const target = document.getElementById("target");

        let score = 0;
        let timeLeft = 15;
        let gameRunning = false;
        let intervalId = null;

        function updateScore() {
            scoreEl.textContent = score;
        }

        function updateTime() {
            timeEl.textContent = timeLeft;
        }

        function moveTarget() {
            const areaWidth = gameArea.clientWidth - 52;
            const areaHeight = gameArea.clientHeight - 52;

            const x = Math.random() * areaWidth;
            const y = Math.random() * areaHeight;

            target.style.left = x + "px";
            target.style.top = y + "px";
        }

        function endGame() {
            clearInterval(intervalId);
            gameRunning = false;
            startBtn.disabled = false;
            startBtn.textContent = "Play again";
            target.style.display = "none";
            alert("Game over! Your score: " + score);
        }

        function startGame() {
            score = 0;
            timeLeft = 15;
            updateScore();
            updateTime();

            gameRunning = true;
            startBtn.disabled = true;
            startBtn.textContent = "In progress...";

            target.style.display = "block";
            moveTarget();

            intervalId = setInterval(() => {
                timeLeft -= 1;
                updateTime();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        startBtn.addEventListener("click", startGame);

        target.addEventListener("click", () => {
            if (!gameRunning) return;

            score += 1;
            updateScore();
            moveTarget();
        });
    </script>
</body>
</html>
